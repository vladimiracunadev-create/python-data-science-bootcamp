name: Security

on:
  pull_request:
  push:
    branches: ["main"]
  schedule:
    - cron: "0 11 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scanners
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit bandit

      - name: Dependency audit
        # PYSEC-2026-597 / CVE-2026-12243: path traversal en nltk (dep transitiva),
        # sin versión con fix publicada al 2026-07-06. No explotable en este proyecto
        # (app local Qt/Flask, sin loader de recursos NLTK expuesto a input externo).
        # Revisar en https://osv.dev/vulnerability/PYSEC-2026-597 y quitar el --ignore
        # en cuanto salga un nltk parcheado.
        run: pip-audit -r requirements.txt --ignore-vuln PYSEC-2026-597

      - name: Static security scan
        run: |
          bandit -q -r app src scripts -x app/saved_notebooks
          bandit -q run_program.py
