name: Deploy Student Landing

on:
  push:
    branches: ["main"]
    paths:
      - "site/**"
      - "classes/**/README.md"
      - "scripts/generate_site_curriculum.py"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install generator dependencies
        # pygments lo usa `codehilite` para colorear los bloques de código; sin
        # él python-markdown emite el bloque sin resaltar y el sitio pierde el
        # coloreado que sí tiene la app de escritorio.
        run: python -m pip install "markdown>=3.6" "pygments>=2.17"

      - name: Generate curriculum HTML
        run: python scripts/generate_site_curriculum.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
