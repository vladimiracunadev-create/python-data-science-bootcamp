[project]
name = "python-data-science-program"
version = "3.9.0"
description = "Python Data Science Program: 232 clases en 9 partes, notebooks ejecutables, datasets y entorno de ejecución local"
authors = [{ name = "Vladimir Acuña", email = "vladimiracunadev-create@github" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.12"
keywords = ["data-science", "program", "python", "pandas", "machine-learning", "educacion"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
"examples/*.py" = ["E402"]
"scripts/build_parte0_*.py" = ["E402", "I001", "E741"]
"scripts/build_parte0_classes.py" = ["E741"]
"scripts/_build_class_001_notebook.py" = ["E501", "E741"]
