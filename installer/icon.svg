<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="t d">
  <title id="t">Python Data Science Program</title>
  <desc id="d">Icono del producto: los dos lazos entrelazados de Python sobre un histograma ascendente.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14414f"/>
      <stop offset="1" stop-color="#0a2029"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#f4cd77"/>
      <stop offset="1" stop-color="#d9a441"/>
    </linearGradient>
    <linearGradient id="teal" x1="1" y1="1" x2="0.4" y2="0">
      <stop offset="0" stop-color="#0d9488"/>
      <stop offset="1" stop-color="#34e0cb"/>
    </linearGradient>
  </defs>

  <!-- Placa del producto -->
  <rect width="256" height="256" rx="58" fill="url(#bg)"/>
  <rect x="5" y="5" width="246" height="246" rx="53" fill="none" stroke="#2dd4bf" stroke-width="2" opacity="0.28"/>

  <!-- Histograma ascendente de fondo: la mitad "data science" del producto.
       Va detrás de los lazos y muy tenue para no ensuciar el icono a 16 px. -->
  <g fill="#2dd4bf" opacity="0.16">
    <rect x="40"  y="176" width="26" height="44" rx="5"/>
    <rect x="76"  y="152" width="26" height="68" rx="5"/>
    <rect x="112" y="120" width="26" height="100" rx="5"/>
    <rect x="148" y="92"  width="26" height="128" rx="5"/>
    <rect x="184" y="58"  width="26" height="162" rx="5"/>
  </g>

  <!-- Lazo superior (dorado) -->
  <path d="M112 42h26c28 0 42 15 42 42v20h-52c-19 0-30 12-30 31v19H72c-25 0-42-16-42-42V84c0-27 15-42 42-42h40Z"
        fill="url(#gold)"/>
  <circle cx="70" cy="70" r="10" fill="#0a2029"/>

  <!-- Lazo inferior (teal) -->
  <path d="M144 214h-26c-28 0-42-15-42-42v-20h52c19 0 30-12 30-31v-19h26c25 0 42 16 42 42v28c0 27-15 42-42 42h-40Z"
        fill="url(#teal)"/>
  <circle cx="186" cy="186" r="10" fill="#f5efe3"/>
</svg>
